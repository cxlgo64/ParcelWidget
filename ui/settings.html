<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--accent:#0a84ff;--err:#c4372c;--chip:#ececf1;--green:#2f9e5b}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1c1e;--card:#2c2c2e;--text:#f2f2f7;--muted:#9a9aa0;--line:#3a3a3c;--err:#ff6b5e;--chip:#3a3a3c}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--muted);padding:7px 9px;white-space:nowrap;flex:none;border-radius:8px 8px 0 0;font-size:13px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
main{flex:1;overflow-y:auto;padding:4px 18px 24px}
.tab{display:none}.tab.on{display:block}
.section{margin:16px 0 6px;font-size:12.5px;font-weight:700}
label{display:block;margin:9px 0 3px;color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=number],input[type=time],select,textarea{width:100%;border:1px solid var(--line);
  background:var(--card);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:none}
.row .grow{flex:1}
.hint{color:var(--muted);font-size:11.5px;margin-top:4px}
.chk{display:flex;align-items:center;gap:7px;margin-top:10px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px #0003}
.btn{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:6px 14px;font-size:12.5px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.pkg{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pkg:first-child{border-top:0}
.pkg .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--chip);flex:none}
.tag.UPS{background:#5b3a1f;color:#ffd38a}.tag.FedEx{background:#4d148c;color:#fff}
.tag.USPS{background:#1c3f94;color:#fff}.tag.Amazon{background:#232f3e;color:#ff9900}
.pkg .mid{flex:1;min-width:0}
.pkg .num{font:11.5px ui-monospace,Menlo,Consolas,monospace}
.pkg .st{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg.done .st{color:var(--green)}
.pkg .e{color:var(--err);font-size:11px}
.pkg .ic{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px}
.pkg .ic:hover{background:var(--chip);color:var(--text)}
.empty{color:var(--muted);padding:10px 0;font-size:12px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:12px}
.skins{display:flex;flex-wrap:wrap;gap:8px}
.skinopt{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:11.5px;color:var(--muted);text-align:center}
.skinopt.on{border-color:var(--accent);color:var(--text);font-weight:600}
.skinopt .th{width:40px;height:44px;background:center/contain no-repeat;display:grid;place-items:center;font-size:20px;color:var(--accent)}
.skinopt .del{position:absolute;top:2px;right:4px;font-size:10px;display:none;padding:0 3px;border-radius:4px}
.skinopt:hover .del{display:block}
.skinopt .del:hover{background:var(--chip);color:var(--err)}
.refbox{display:flex;align-items:center;gap:8px}
.refbox .pv{width:48px;height:48px;border-radius:8px;border:1px dashed var(--line);background:center/contain no-repeat var(--card);
  display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.refbox .nm{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:10px}
.prog>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.jobmsg{font-size:12px;margin-top:5px;color:var(--muted)}
.jobmsg.err{color:var(--err)}
.logbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.logbar .grow{flex:1}
.logbar{flex-wrap:nowrap}
.logst{font-size:11.5px;color:var(--muted);margin-top:8px}
.logst b{color:var(--text);font-weight:600}
#logbox{margin-top:8px;height:400px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;user-select:text}
#logbox .t{color:var(--muted)}
#logbox .err{color:var(--err)}
#logbox .ck{color:var(--accent)}
#logbox .pw{color:var(--green)}
.ubox{padding:8px 0;border-top:1px solid var(--line)}
.ubox:first-child{border-top:0}
.ubox .t{font-weight:600}
.ubox .m{color:var(--muted);font-size:11.5px}
.ubox .d{display:flex;gap:8px;align-items:baseline;font-size:11.5px;margin-top:3px}
.ubox .d code{font:11px ui-monospace,Menlo,monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubox a{color:var(--accent);font-size:11.5px;cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.bdg.ok{background:#e3f4e9;color:var(--green)}.bdg.up{background:#fff1d6;color:#a86400}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:5px 11px;border-radius:7px;
  font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
<!-- General: the widget itself -->
<section class="tab" id="tab-general">
  <div class="section" data-t="language"></div>
  <div class="seg" id="langSeg"></div>
  <div class="section" data-t="size"></div>
  <div class="seg" id="sizeSeg"></div>
  <div class="hint" data-t="sizeHint"></div>
  <div class="chk"><input type="checkbox" id="onTop" onchange="setOnTop(this.checked)"><span data-t="onTop"></span></div>
  <div class="chk" id="touchRow"><input type="checkbox" id="touchId" onchange="setTouchId(this.checked)"><span data-t="touchId"></span>
    <span class="hint" id="touchSt" style="margin:0 0 0 6px"></span></div>
  <div class="hint" id="touchHint" data-t="touchIdHint"></div>
  <div class="section" data-t="skin"></div>
  <div class="skins" id="skins"></div>
  <div class="row" style="margin-top:10px"><span class="hint" style="margin:0" data-t="side"></span><div class="seg" id="sideSeg"></div></div>
</section>

<!-- Parcels -->
<section class="tab" id="tab-parcels">
  <div class="section" data-t="packages"></div>
  <div class="card" id="pkgs"></div>
  <details id="archDetails" ontoggle="fillArchive()"><summary><span data-t="archived"></span> <span id="archCount"></span></summary>
    <div class="card" style="margin-top:6px" id="arch"></div></details>

  <div class="section" data-t="schedule"></div>
  <div class="row"><span data-t="from"></span><input type="time" id="p_start" style="width:110px">
    <span data-t="to"></span><input type="time" id="p_end" style="width:110px">
    <span data-t="every"></span><select id="p_every" style="width:80px"></select><span data-t="minutes"></span></div>
  <div class="hint" data-t="scheduleHint"></div>

  <div class="section" data-t="gmail"></div>
  <label data-t="gmailAddr"></label><input type="text" id="p_addr" placeholder="you@gmail.com">
  <label data-t="appPw"></label><input type="password" id="p_pw">
  <div class="hint" id="pwHint"></div>
  <label data-t="scanDays"></label><input type="number" id="p_days" min="1" style="width:110px">

  <div class="section" data-t="tracking"></div>
  <label data-t="browser"></label><select id="p_browser"></select>
  <div class="hint" data-t="browserHint"></div>
  <div class="chk"><input type="checkbox" id="p_headless"><span data-t="headless"></span></div>
  <div style="margin-top:16px"><button class="btn" onclick="saveParcels()" data-t="save"></button></div>
</section>

<!-- Mail: a first look at the inboxes (Apple Mail, Outlook through Microsoft) -->
<section class="tab" id="tab-mail">
  <div class="hint" style="margin-top:0" data-t="mlS.intro"></div>
  <label class="chk" style="color:var(--text)"><input type="checkbox" id="m_apple" onchange="saveMail()"><span data-t="mlS.apple"></span></label>
  <div class="hint" data-t="mlS.appleHint"></div>
  <div class="row" style="margin-top:10px"><span data-t="mlS.every"></span><select id="m_every" style="width:80px" onchange="saveMail()"></select><span data-t="mlS.minutes"></span>
    <span style="width:14px"></span><span data-t="mlS.hours"></span><select id="m_hours" style="width:80px" onchange="saveMail()"></select><span data-t="mlS.hoursUnit"></span></div>
  <label class="chk" style="color:var(--text)"><input type="checkbox" id="m_notify" onchange="saveMail()"><span data-t="mlS.notify"></span></label>
  <div class="hint" data-t="mlS.notifyHint"></div>

  <div class="section" data-t="mlS.rules"></div>
  <label data-t="mlS.vip"></label><textarea id="m_vip" onchange="saveMail()" placeholder="boss@company.com&#10;school.edu&#10;invoice"></textarea>
  <label data-t="mlS.mute"></label><textarea id="m_mute" onchange="saveMail()" placeholder="glassdoor.com&#10;newsletter"></textarea>

  <div class="section" data-t="mlS.ms"></div>
  <div class="hint" style="margin-top:0" data-t="mlS.msIntro"></div>
  <label data-t="mlS.msClient"></label><input type="text" id="m_client" placeholder="00000000-0000-0000-0000-000000000000" onchange="saveMail()" spellcheck="false">
  <label data-t="mlS.msTenant"></label><select id="m_tenant" onchange="saveMail()"></select>
  <div class="hint" data-t="mlS.msHow"></div>
  <div class="row" style="margin-top:8px"><button class="btn ghost" onclick="api().open_url('https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade')" data-t="mlS.msPortal"></button></div>
  <div class="row" style="margin-top:12px"><span class="grow" id="m_status"></span>
    <button class="btn ghost" id="m_signout" onclick="mlSignOut()" data-t="mlS.signOut"></button></div>
</section>

<!-- Claude Code: finished / needs you / answer in her balloon -->
<section class="tab" id="tab-claude">
  <div class="hint" style="margin-top:0" data-t="clS.intro"></div>
  <label class="chk" style="color:var(--text);margin-top:12px"><input type="checkbox" id="c_on" onchange="saveClaude(true)"><b data-t="clS.enable"></b></label>
  <div class="hint" id="c_hint"></div>
  <div class="hint" id="c_st" style="color:var(--text)"></div>
  <div id="c_opts">
    <label class="chk" style="color:var(--text)"><input type="checkbox" id="c_done" onchange="saveClaude()"><span data-t="clS.done"></span></label>
    <label class="chk" style="color:var(--text)"><input type="checkbox" id="c_perm" onchange="saveClaude()"><span data-t="clS.permissions"></span></label>
    <label class="chk" style="color:var(--text)"><input type="checkbox" id="c_q" onchange="saveClaude()"><span data-t="clS.questions"></span></label>
    <div class="row" style="margin-top:8px"><span data-t="clS.wait"></span><select id="c_wait" style="width:80px" onchange="saveClaude()"></select><span data-t="clS.seconds"></span></div>
  </div>
  <div class="hint" style="margin-top:14px" data-t="clS.privacy"></div>
</section>

<!-- System monitor -->
<section class="tab" id="tab-sysmon">
  <div class="section" data-t="period"></div>
  <div class="seg" id="periodSeg"></div>
  <div class="section" data-t="colors"></div>
  <div class="seg" id="colorSeg"></div>
  <div class="hint" style="margin-top:12px" data-t="sysHint"></div>
</section>

<!-- USB devices and their drivers (macOS) -->
<section class="tab" id="tab-usb">
  <label class="chk" style="color:var(--text)"><input type="checkbox" id="usbAuto" onchange="saveUsb()"><span data-t="usbAuto"></span></label>
  <div class="hint" data-t="usbAutoHint"></div>
  <label class="chk" style="color:var(--text)"><input type="checkbox" id="usbHubs" onchange="saveUsb()"><span data-t="usbHubs"></span></label>
  <div class="section" data-t="usbFolder"></div>
  <div class="row"><span class="hint grow" id="usbFolder" style="margin:0"></span>
    <button class="btn ghost" onclick="api().feature('usb','reveal_downloads')" data-t="lg.reveal"></button></div>
  <div class="row" style="margin-top:16px"><div class="section grow" style="margin:0" data-t="usbDevices"></div>
    <button class="btn ghost" id="usbCheck" onclick="usbCheck()"></button></div>
  <div class="hint" id="usbStatus"></div>
  <div class="card" id="usbList" style="margin-top:8px"></div>
</section>

<!-- Custom skin: generated with an image AI (skinmaker/) -->
<section class="tab" id="tab-skin">
  <div class="hint" data-t="csIntro" style="margin-top:12px"></div>
  <label data-t="csName"></label><input type="text" id="cs_name">
  <label data-t="csDesc"></label><textarea id="cs_desc"></textarea>
  <label data-t="csRef"></label>
  <div class="refbox"><div class="pv" id="cs_pv">＋</div><div class="nm" id="cs_refname"></div>
    <button class="btn ghost" onclick="pickRef()" data-t="csPick"></button>
    <button class="btn ghost" id="cs_clear" onclick="clearRef()" style="display:none">✕</button></div>
  <div class="hint" id="cs_refhint"></div>
  <div class="section" data-t="csProvider"></div>
  <select id="cs_provider" onchange="onProvider()"></select>
  <div class="hint" id="cs_pnote"></div>
  <label id="cs_keylabel"></label><input type="password" id="cs_key">
  <div class="hint" id="cs_keyhint"></div>
  <details><summary data-t="csAdvanced"></summary>
    <label data-t="csModel"></label><input type="text" id="cs_model">
    <label data-t="csEndpoint"></label><input type="text" id="cs_base"></details>
  <div id="cs_job" style="display:none"><div class="prog"><div id="cs_bar"></div></div><div class="jobmsg" id="cs_jobmsg"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="cs_go" onclick="startSkinGen()" data-t="csGenerate"></button>
    <button class="btn ghost" id="cs_cancel" onclick="cancelSkinGen()" data-t="cancel"></button></div>
  <div class="hint" data-t="csCost"></div>
</section>

<!-- Log: widget.log, for debugging -->
<section class="tab" id="tab-printers">
  <div class="hint" style="margin-top:12px" data-t="ap.intro"></div>
  <div class="row" style="margin-top:14px"><div class="section grow" style="margin:0" data-t="ap.list"></div>
    <button class="btn ghost" id="apFind" onclick="apRefresh(true)" data-t="ap.find"></button>
    <button class="btn ghost" id="apRefresh" onclick="apRefresh(false)"></button></div>
  <label class="chk" style="color:var(--text);margin-top:6px"><input type="checkbox" id="apDef" checked><span data-t="ap.setupDef"></span></label>
  <div class="card" id="apList" style="margin-top:8px"></div>
  <div class="section" data-t="ap.addr"></div>
  <div class="row"><input type="text" id="apAddr" style="flex:1;width:auto" data-tp="ap.addrPh" onkeydown="if(event.key==='Enter')apAddAddr()">
    <button class="btn" id="apAddrGo" onclick="apAddAddr()" data-t="ap.addrGo"></button></div>
  <div class="hint" data-t="ap.addrHint"></div>
  <div class="jobmsg" id="apAddrMsg"></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="api().feature('usb','add_printer_window')" data-t="ap.addWin"></button>
    <button class="btn ghost" onclick="api().feature('usb','printer_settings')">⚙︎ Printers &amp; Scanners</button></div>
</section>
<section class="tab" id="tab-log">
  <div class="logbar"><div class="seg" id="logSeg"></div>
    <label class="chk" style="margin:0 0 0 6px;color:var(--text)"><input type="checkbox" id="logAuto" checked onchange="logTimer()"><span data-t="lg.auto"></span></label>
    <span class="grow"></span>
    <button class="btn ghost" onclick="fillLog()" data-t="lg.refresh"></button>
    <button class="btn ghost" onclick="copyLog()" data-t="lg.copy"></button></div>
  <div class="logst" id="logst"></div>
  <div id="logbox"></div>
  <div class="logbar"><span class="hint grow" id="logpath" style="margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left"></span>
    <button class="btn ghost" onclick="api().reveal_log()" data-t="lg.reveal"></button>
    <button class="btn ghost" onclick="clearLog()" data-t="lg.clear"></button></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script>
/* The settings window. Tabs: General (the widget), one per feature, and Custom skin.
   Opened from the menus: settings.html#general | #parcels | #parcels:add | #sysmon | #skin | #log */
const TABS = ['general', 'parcels', 'mail', 'claude', 'sysmon', 'usb', 'printers', 'skin', 'log'];
let tab = 'general', state = {f: {}}, settings = null;

function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1500); }
function seg(id, opts, cur, fn){
  $(id).innerHTML = opts.map(o => `<button class="${String(o.key) === String(cur) ? 'on' : ''}" onclick="${fn}('${o.key}')">${esc(o.label)}</button>`).join('');
}
function openTab(t){
  const [name, sub] = String(t || 'general').split(':');
  tab = TABS.includes(name) ? name : 'general';
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + tab));
  renderNav();
  if(tab === 'skin') fillCustomSkin();
  if(tab === 'log') fillLog();
  if(tab === 'printers') apRefresh(false);
  logTimer();
}
function renderNav(){
  $('nav').innerHTML = TABS.map(k => `<button class="${k === tab ? 'on' : ''}" onclick="openTab('${k}')">${esc(T().tabs[k])}</button>`).join('');
}
window.onhashchange = () => openTab(location.hash.slice(1));

async function load(){
  state = await api().get_state();
  if(state.lang !== lang){ lang = state.lang; applyStaticText(); renderNav(); settings = null; }
  document.title = T().title;
  if(!settings){ settings = await api().get_settings(); fillForms(); }
  fillGeneral(); fillPackages(); fillMail(); fillClaude(); fillSysmon(); fillUsb(); fillPrinters();
  if(tab === 'skin') renderSkinJob(state.skin_job);
}
window.onBackendUpdate = () => load();

/* ---------------- General ---------------- */
async function fillGeneral(){
  const L = T();
  seg('langSeg', [{key:'en', label:'English'}, {key:'zh', label:'中文'}], lang, 'pickLang');
  seg('sizeSeg', state.presets.map(p => ({key: p.key, label: p.key === 'ext' ? (lang === 'zh' ? '外接屏' : 'External') : p.label})), state.size_preset, 'pickSize');
  $('onTop').checked = !!state.on_top;
  $('touchRow').style.display = $('touchHint').style.display = state.touch_id === null ? 'none' : '';
  $('touchId').checked = !!state.touch_id;
  $('touchSt').textContent = state.touch_id ? (state.unlocked ? L.touchIdOn : L.touchIdOff) : '';
  seg('sideSeg', [{key:'left', label:L.sideLeft}, {key:'right', label:L.sideRight}], state.skin_side, 'pickSide');
  const skins = await api().get_skins(), cur = state.skin ? state.skin.id : '';
  $('skins').innerHTML = skins.map(s => {
    const label = esc(lang === 'zh' && s.name_zh ? s.name_zh : s.name);
    const th = s.thumb ? `style="background-image:url('skins/${encodeURIComponent(s.id)}/${encodeURIComponent(s.thumb)}')"` : '';
    const del = s.custom ? `<span class="del" title="${esc(L.deleteSkin)}" onclick="event.stopPropagation();deleteSkin('${esc(s.id)}','${label}')">✕</span>` : '';
    return `<div class="skinopt ${s.id === cur ? 'on' : ''}" onclick="pickSkin('${esc(s.id)}')">${del}<div class="th" ${th}></div>${label}</div>`;
  }).join('') + `<div class="skinopt" onclick="openTab('skin')"><div class="th">＋</div>${esc(L.addSkin)}</div>`;
}
async function pickLang(k){ await api().set_lang(k); load(); }
async function pickSize(k){ await api().set_size(k); load(); }
async function setOnTop(v){ await api().set_on_top(v); }
async function setTouchId(v){ await api().set_touch_id(v); load(); }
async function pickSkin(id){ await api().set_skin(id, null); load(); }
async function pickSide(s){ await api().set_skin(null, s); load(); }
async function deleteSkin(id, name){ if(confirm(T().deleteConfirm(name))){ await api().delete_skin(id); load(); } }

/* ---------------- Parcels ---------------- */
function fillForms(){
  const p = settings.parcels, L = T();
  $('p_start').value = p.start; $('p_end').value = p.end;
  $('p_every').innerHTML = [30, 45, 60, 90, 120, 180, 240].map(m => `<option value="${m}" ${+p.every_min === m ? 'selected' : ''}>${m}</option>`).join('');
  $('p_addr').value = p.gmail_address || ''; $('p_pw').value = '';
  $('p_pw').placeholder = p.has_password ? L.pwKeep : '';

  const s = settings && settings.usb, U = T().u, st = (state.f || {}).usb || {};

  $('usbAuto').checked = !!s.auto_download; $('usbHubs').checked = !!s.show_hubs;
  $('usbFolder').textContent = s.folder.replace(/^\/Users\/[^/]+/, '~');
  const busy = st.busy || (st.online || {}).st === 'running';
  $('usbCheck').textContent = busy ? U.checking : U.checkAgain; $('usbCheck').disabled = !!busy;
  const m = st.macos || {}, upd = ((m.updates || []).find(u => /^macos/i.test(u.title)) || {}).version;
  $('usbStatus').textContent = [st.last_scan ? U.checked(hhmm(st.last_scan)) : '',
    upd ? U.macosUpd(m.version, upd) : m.version && m.updates ? U.macosOk(m.version) : ''].filter(Boolean).join(' · ');
  const ds = st.devices || [];
  $('usbList').innerHTML = ds.length ? ds.map(d => {
    const B = U.b, drv = (d.drivers || []).map(x => {
      const txt = x.check === 'apple_update' ? B.apple_update(upd || '') : x.check === 'maybe_newer' ? B.maybe_newer(x.hint) : B[x.check] || '';
      const cls = /ok$/.test(x.check) ? 'ok' : /update|newer/.test(x.check) ? 'up' : '';
      return `<div class="d"><code title="${esc(x.path || '')}">${esc(x.bundle)} ${esc(x.version || '')} · ${esc(x.type)}</code>
        <span class="bdg ${cls}" title="${esc(U.tip[x.check] || '')}">${esc(txt)}</span></div>` +
        ((x.links || []).length && !x.apple ? (x.links.map(l => `<a onclick="api().open_url('${esc(l.url)}')">↗ ${esc(l.title)}</a>`).join('')) : '');
    }).join('') || `<div class="m">${esc(d.kind === 'printer' ? U.cups : U.noDriver)}</div>`;
    const meta = [d.vendor_db || d.vendor, d.product_db, `${d.vid}:${d.pid}`, d.speed, d.serial ? 'S/N ' + d.serial : ''].filter(Boolean).map(esc).join(' · ');
    return `<div class="ubox"><div class="t">${esc(d.name)} <span class="m">· ${esc(U.kinds[d.kind] || '')}</span></div><div class="m">${meta}</div>${drv}</div>`;
  }).join('') : `<div class="empty">${esc(U.none)}</div>`;
}

/* ---------------- Printers & AirPrint ---------------- */
let apFound = false;
function apRefresh(discover){ if(discover) apFound = true; api().feature('usb', 'printers', !!discover); }
function apJobText(j){
  const J = T().ap.job, E = T().ap.err;
  if(!j) return '';
  if(j.st === 'working') return J.working;
  if(j.st === 'manual') return J.manual;
  if(j.st === 'error') return J.error(E[j.msg] || j.msg || '');
  if(j.what === 'test') return J.test;
  return j.already ? J.already(j.queue || '') : J.done(j.queue || '');
}
function fillPrinters(){
  const A = T().ap, air = ((state.f || {}).usb || {}).air;
  if(!air || !$('apList')) return;
  const loading = air.loading, jobs = air.jobs || {}, gs = air.groups;
  $('apRefresh').textContent = loading ? A.looking : A.refresh; $('apRefresh').disabled = !!loading; $('apFind').disabled = !!loading;
  const defOn = $('apDef').checked;
  $('apList').innerHTML = !gs ? `<div class="empty"><span class="spin">⟳</span> ${esc(A.looking)}</div>` : gs.length ? gs.map(g => {
    const k = esc(g.key), j = jobs[g.key], busy = j && j.st === 'working';
    const st = A.st[g.status] || '', cls = g.status === 'ready' ? 'ok' : g.status === 'other' ? 'up' : '';
    const via = (A.via[g.via] || '') + (g.via === 'usb' && !g.connected ? ' · ' + A.notConnected : '');
    const qs = (g.queues || []).map(q => `<div class="d"><code title="${esc(q.uri)}">${esc(q.name)} · ${esc(q.model || '')}</code>` +
      [q.default ? `<span class="bdg ok">${esc(A.isDefault)}</span>` : '', q.airprint ? `<span class="bdg">${esc(A.airprint)}</span>` : '',
       q.offline ? `<span class="bdg up">${esc(A.offlineQ)}</span>` : ''].join('') + '</div>').join('');
    const hint = g.server ? A.server : g.status === 'other' ? A.hintOther : g.status === 'none' ? A.hintNone :
      g.status !== 'ready' && g.via === 'usb' && !g.connected ? A.hintNoUsb : '';
    const b = [];
    if(g.status !== 'ready' && g.can_setup) b.push(`<button class="btn" ${busy ? 'disabled' : ''} onclick="apSetup('${k}')">🖨 ${esc(A.setup)}</button>`);
    if(g.best && (g.extra || []).length) b.push(`<button class="btn ghost" ${busy ? 'disabled' : ''} onclick="apTidy('${k}')">${esc(A.tidy(g.extra.length))}</button>`);
    if(g.best && !g.default) b.push(`<button class="btn ghost" ${busy ? 'disabled' : ''} onclick="apCall('make_default','${k}')">${esc(A.def)}</button>`);
    if(g.best) b.push(`<button class="btn ghost" ${busy ? 'disabled' : ''} onclick="apCall('test_page','${k}')">${esc(A.test)}</button>`);
    return `<div class="ubox"><div class="t">${esc(g.name)} <span class="m">· ${esc(via)}</span> <span class="bdg ${cls}">${esc(st)}</span></div>
      ${qs}${hint ? `<div class="m" style="margin-top:3px">${esc(hint)}</div>` : ''}
      ${b.length ? `<div class="row" style="margin-top:6px;flex-wrap:wrap">${b.join('')}</div>` : ''}
      ${j ? `<div class="jobmsg ${j.st === 'error' ? 'err' : ''}">${esc(apJobText(j))}</div>` : ''}</div>`;
  }).join('') : `<div class="empty">${esc(A.none)}</div>`;
  const aj = jobs.addr;
  $('apAddrMsg').textContent = apJobText(aj); $('apAddrMsg').className = 'jobmsg' + (aj && aj.st === 'error' ? ' err' : '');
  $('apAddrGo').disabled = !!(aj && aj.st === 'working');
}

  const g = ((((state.f || {}).usb || {}).air || {}).groups || []).find(x => x.key === k);
  if(!g || !confirm(T().ap.tidyAsk(g.extra.length, g.best, g.extra.map(n => '• ' + n).join('\n')))) return;

async function cancelSkinGen(){
  if(state.skin_job && !state.skin_job.done) await api().cancel_skin_gen();

function skinJobText(j){
  const L = T();
  if(j.error) return j.error === 'cancelled' ? L.csCancelled : L.csErr(j.error);
  if(j.done) return j.failed && j.failed.length ? L.csPartial(j.failed.map(f => L.csLabels[f] || f).join(', ')) : L.csDone;
  return L.csStep(Math.min(j.step + 1, j.total), j.total, L.csLabels[j.label] || j.label);
}
function renderSkinJob(j){
  const running = j && !j.done;
  $('cs_job').style.display = j ? '' : 'none';
  if(j){
    $('cs_bar').style.width = Math.round(100 * (j.done && !j.error ? 1 : j.step / j.total)) + '%';
    $('cs_jobmsg').textContent = skinJobText(j);
    $('cs_jobmsg').classList.toggle('err', !!j.error);
  }
  $('cs_go').disabled = !!running;
  $('cs_cancel').textContent = running ? T().cancel : T().close;
}

/* ---------------- Log ---------------- */
let logFilter = 'all', logLines = [], logT = null;
const LOG_KINDS = {
  errors: l => /error[:(]|traceback|exception|failed|giving up|no network|^\s+File "|[1-9]\d* errors/i.test(l),
  checks: l => /check|gmail|scan|track|attempt|wake|sleep|retry|startup|no network/i.test(l),
};
function logClass(l){
  if(LOG_KINDS.errors(l)) return 'err';
  if(/sleep|woke|wake/i.test(l)) return 'pw';
  if(/check \(/i.test(l)) return 'ck';
  return '';
}
function logTimer(){
  clearInterval(logT);
  if(tab === 'log' && $('logAuto').checked) logT = setInterval(fillLog, 3000);
}
async function fillLog(){
  const L = T().lg, r = await api().get_log(600);
  logLines = r.lines;
  seg('logSeg', ['all', 'checks', 'errors'].map(k => ({key: k, label: L[k]})), logFilter, 'pickLogFilter');
  const st = r.status || {};
  $('logst').innerHTML = esc(st.asleep ? L.asleep : st.busy ? L.busy : !st.next_check ? L.none
    : st.retry ? L.retry(hhmm(st.next_check), st.net_tries) : L.next(hhmm(st.next_check)));
  $('logpath').textContent = '\u200e' + r.path.replace(/^.*\/Library\//, '~/Library/') + ' · ' + L.lines(r.lines.length) + '\u200e';
  $('logpath').title = r.path;
  const box = $('logbox'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  const f = LOG_KINDS[logFilter], rows = f ? logLines.filter(f) : logLines;
  box.innerHTML = rows.length ? rows.map(l => {
    const m = l.match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) (.*)$/);
    return `<div class="${logClass(l)}">${m ? `<span class="t">${esc(m[1])}</span> ${esc(m[2])}` : esc(l)}</div>`;
  }).join('') : `<div class="t">${esc(L.empty)}</div>`;
  if(atEnd || !box.dataset.seen){ box.scrollTop = box.scrollHeight; box.dataset.seen = 1; }
}
function pickLogFilter(k){ logFilter = k; fillLog(); }
async function copyLog(){
  const f = LOG_KINDS[logFilter], text = (f ? logLines.filter(f) : logLines).join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(T().lg.copied);
}
async function clearLog(){ if(confirm(T().lg.clearConfirm)){ await api().clear_log(); fillLog(); } }
