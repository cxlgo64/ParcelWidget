<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parcel Widget</title>
<style>
:root{--ink:#1f1f24;--frame:#2f80ed;--paper:#ffffff;--muted:#77777f;--line:#e4e2dc;--accent:#0a84ff;--green:#2f9e5b;--greenbg:#e8f6ec;--err:#c4372c;--chip:#f1efe9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none}
/* everything scales with the screen-size preset (--z); anchored bottom-left of the window */
#root{--z:.78;position:absolute;left:0;bottom:0;transform-origin:0 100%;transform:scale(var(--z))}
#stage{position:relative}

/* ---- the character ---- */
#pet{position:absolute;bottom:0;z-index:2}
.side-right #pet{right:0}
.side-left #pet{left:0}
#sprite{position:absolute;inset:0;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px #0005);pointer-events:none}
#hit{position:absolute;left:24%;right:24%;top:3%;bottom:2%;cursor:pointer}
#hit.dragging{cursor:grabbing}

/* ---- hover buttons around her head (idle mode) ---- */
#hover{position:absolute;inset:0;pointer-events:none;z-index:3}
.fbtn{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2.5px solid var(--frame);
  background:var(--paper);font-size:16px;display:grid;place-items:center;cursor:pointer;pointer-events:auto;
  box-shadow:2px 2px 0 #0003;opacity:0;transform:scale(.4);transition:opacity .16s,transform .16s;padding:0}
.fbtn:hover{background:#e8f1fe;transform:scale(1.12)!important}
#hover.show .fbtn{opacity:1;transform:scale(1)}
#hover:not(.show) .fbtn{pointer-events:none}
.fbtn svg{width:20px;height:20px;display:block}
/* one name label for all buttons, on the top layer: always above the button you point at, never under another */
#htip{position:absolute;z-index:10;white-space:nowrap;background:var(--frame);color:#fff;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:9px;opacity:0;transition:opacity .12s;pointer-events:none;box-shadow:1px 1px 0 #0002}
#htip.show{opacity:1}

/* ---- comic speech balloon ---- */
#balloon{position:absolute;z-index:4;background:var(--paper);border:2.5px solid var(--frame);border-radius:20px;
  box-shadow:3px 4px 0 #2f80ed2e;padding:9px 12px 10px;display:none;flex-direction:column;
  transform-origin:100% 100%;animation:pop .18s ease-out}
.side-left #balloon{transform-origin:0 100%}
#balloon.show{display:flex}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#tail{position:absolute;bottom:-25px;width:44px;height:28px;overflow:visible;pointer-events:none}
.side-right #tail{right:14px}
.side-left #tail{left:14px;transform:scaleX(-1)}
#tail .fill{fill:var(--paper)}
#tail .edge{fill:none;stroke:var(--frame);stroke-width:2.5;stroke-linejoin:round}
.bhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:grab}
.bhead .t{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .pg{color:var(--muted);font-size:11px}
.bx{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;border-radius:5px}
.bx:hover{color:var(--ink);background:var(--chip)}
.bbody{overflow-y:auto;min-height:0;flex:0 1 auto;-webkit-user-select:text;user-select:text}
.bbody .ln{margin:2px 0;font-size:12.5px}
.bbody .dim{color:var(--muted);font-size:11.5px}
.bbody .warn{color:var(--err)}
.bbody code{font:11px ui-monospace,Menlo,Consolas,monospace}
.bbody.quip{font-size:13px;font-weight:500;padding:1px 0}
.bfoot{display:flex;align-items:center;gap:6px;margin-top:8px}
.bfoot:empty{display:none}
.bfoot .sp{flex:1;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okbtn{border:2px solid var(--frame);background:var(--frame);color:#fff;font-weight:700;border-radius:14px;padding:3px 14px;
  font-size:12.5px;cursor:pointer;box-shadow:2px 2px 0 #2f80ed33}
.okbtn:hover{background:#1f6fdc}
.okbtn.ghost{background:#fff;color:var(--frame);box-shadow:none}
.okbtn.ghost:hover{background:#e8f1fe}
.okbtn:disabled{background:var(--chip);color:var(--muted);border-color:#bbb;box-shadow:none;cursor:default}
.lnk{border:0;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0}
.lnk:disabled{color:var(--muted);cursor:default}
.binput{display:none;gap:5px;margin-top:7px}
.binput.show{display:flex}
.binput input{flex:1;min-width:0;border:1.5px solid #cfe0f8;border-radius:12px;padding:4px 9px;font-size:12px;outline:none;
  -webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.binput input:focus{border-color:var(--frame)}
.binput button{border:0;background:var(--frame);color:#fff;border-radius:12px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer}
.bmsg{font-size:11px;color:var(--muted);margin-top:3px;min-height:0}
.bmsg:empty{display:none}
.bmsg.err{color:var(--err)}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* package rows */
.pk{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px dashed #d6e4f7}
.pk:first-child{border-top:0}
.pk .tag{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--chip);flex:none;margin-top:2px}
.tag.UPS{background:#5b3a1f;color:#ffd38a}.tag.FedEx{background:#4d148c;color:#fff}
.tag.USPS{background:#1c3f94;color:#fff}.tag.Amazon{background:#232f3e;color:#ff9900}
.pk .mid{flex:1;min-width:0}
.pk .st{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.done .st{color:var(--green)}
.pk .meta{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .num{font:10.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .num:hover{color:var(--accent)}
.pk .e{color:var(--err);font-size:11px}
.pk .acts{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .1s}
.pk:hover .acts{opacity:1}
.pk .acts button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:1px 3px;border-radius:5px}
.pk .acts button:hover{background:var(--chip);color:var(--ink)}
.gotbtn{border:1.5px solid var(--green);background:var(--greenbg);color:var(--green);font-weight:700;border-radius:10px;
  padding:1px 8px;font-size:11px;cursor:pointer;flex:none;margin-top:1px}
.spin{display:inline-block;animation:spin 1s linear infinite}
/* USB devices */
.ud{display:flex;gap:7px;padding:5px 0;border-top:1px dashed #d6e4f7}
.ud:first-child{border-top:0}
.ud .ic{font-size:15px;line-height:1.2;flex:none;width:18px;text-align:center}
.ud .mid{flex:1;min-width:0}
.ud .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud .sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud .drv{display:flex;gap:5px;align-items:center;font-size:11px;margin-top:1px}
.ud .drv .dn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
.badge{flex:none;font-size:10px;font-weight:700;padding:0 6px;border-radius:8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--greenbg);color:var(--green)}
.badge.up{background:#fff3dc;color:#b26a00}
.ud .links a,.prl a{color:var(--accent);font-size:11px;cursor:pointer;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prl .acts{display:flex;gap:10px;margin-top:3px}
.bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--frame)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Claude */
.cltext{white-space:pre-wrap;max-height:170px;overflow-y:auto;font-size:12.5px;margin:3px 0}
.clproj{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--chip);color:var(--muted);margin-bottom:3px}
.clcode{font:11px ui-monospace,Menlo,Consolas,monospace;background:#f4f6fa;border-radius:6px;padding:5px 7px;margin:4px 0;
  white-space:pre-wrap;word-break:break-all;max-height:120px;overflow-y:auto}
.clbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.clopt{border:1.5px solid var(--frame);background:#fff;color:var(--ink);border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer;text-align:left}
.clopt:hover{background:#e8f1fe}
.clopt.on{background:var(--frame);color:#fff}
.clopt.go{background:var(--frame);color:#fff;font-weight:700}
.clopt.no{border-color:#d9534f;color:#c0392b}
.clq{margin-top:6px}
.clq .hd{font-size:10.5px;font-weight:700;color:var(--muted)}
.clturn{padding:5px 0;border-top:1px dashed #d6e4f7}
.clturn:first-child{border-top:0}
.clturn .q{font-size:11.5px;color:var(--muted);white-space:pre-wrap;max-height:48px;overflow:hidden}
.clturn .q b{color:var(--ink)}
.clturn .step{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clfold{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:5px}
.clfold button{border:1px solid #cfe0f8;background:#fff;border-radius:9px;font-size:10.5px;padding:1px 7px;cursor:pointer;color:var(--muted)}
.clm{position:relative;display:inline-flex;align-items:center;margin-right:2px}
.clmb{border:1px solid #cfe0f8;background:#fff;border-radius:9px;font-size:10.5px;padding:1px 7px;cursor:pointer;color:var(--ink);
  white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.clm.open .clmb,.clmb:hover{border-color:var(--frame)}
.clmp{margin:8px 0 2px;border:2px solid var(--frame);border-radius:12px;padding:6px 9px 7px;background:var(--paper);font-size:11.5px}
.clmp .bt{display:flex;align-items:center;font-weight:700}.clmp .bt span{flex:1}
.clmp .cg{margin-top:5px}.clmp .bn{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
.clmp .cv{display:flex;flex-wrap:wrap;gap:3px}
.clmp .cv button{border:1px solid #cfe0f8;background:#fff;border-radius:9px;font-size:11px;padding:1px 7px;cursor:pointer;color:var(--ink)}
.clmp .cv button.on{border-color:var(--frame);background:var(--frame);color:#fff;font-weight:700}
.clmp .cv button:disabled{opacity:.4;cursor:default}
.clmp .bw{color:var(--muted);font-size:10.5px;margin-top:5px}
#balloon.battle .clmp{font-size:12.5px}#balloon.battle .clmp .cv button{font-size:12px;padding:2px 9px}
#balloon.battle .clmb{font-size:12px;max-width:220px}
.clfold button.on{border-color:var(--frame);color:var(--ink);font-weight:700}
/* battle mode (战斗模式): the big chat dialog for Claude小姐 / Codex */
#balloon.battle{box-shadow:5px 5px 0 #2f80ed44}
#balloon.battle .bhead .t{font-size:15px}
#bextra{display:flex;align-items:center}
.batt{position:relative;display:inline-flex;align-items:center;color:var(--muted);cursor:default;padding:2px 3px}
.batt .lv{fill:#34c759}.batt.mid .lv{fill:#ff9f0a}.batt.low .lv{fill:#ff3b30}
.batt .bpop{display:none;position:absolute;top:100%;right:-40px;margin-top:4px;z-index:20;width:190px;
  background:var(--paper);border:2px solid var(--frame);border-radius:12px;padding:7px 9px;box-shadow:2px 3px 0 #2f80ed2e;
  color:var(--ink,#222);font-size:11.5px;font-weight:400;line-height:1.35;cursor:default}
.batt:hover .bpop{display:block}
.bpop .bt{display:block;font-weight:700;margin-bottom:4px}
.bpop .br{display:flex;align-items:center;gap:6px;margin-top:4px}
.bpop .bn{flex:0 0 auto;min-width:62px}
.bpop .bm{flex:1;height:6px;border-radius:3px;background:#0001;overflow:hidden}
.bpop .bm i{display:block;height:100%;background:#34c759}.bpop .bm i.mid{background:#ff9f0a}.bpop .bm i.low{background:#ff3b30}
.bpop .br b{min-width:30px;text-align:right}
.bpop .bw{color:var(--muted);font-size:10.5px;padding-left:68px}
#balloon.battle .bbody .cltext{max-height:none;font-size:13.5px;line-height:1.5}
#balloon.battle .clturn{padding:8px 0}
#balloon.battle .clturn .q{max-height:none;font-size:12.5px}
#balloon.battle .clturn .step{font-size:11.5px}
#balloon.battle .binput input{font-size:13.5px;padding:7px 12px}
#bbig.on{color:#fff;background:var(--frame)}
#balloon.battle .clcode{font-size:13px;line-height:1.45;max-height:300px;padding:8px 10px}
#balloon.battle .ln{font-size:13.5px}
#balloon.battle .clopt{font-size:13.5px;padding:5px 14px}
/* mail */
.ml{display:flex;gap:6px;align-items:flex-start;padding:5px 2px;border-top:1px dashed #d6e4f7;cursor:pointer;border-radius:6px}
.ml:first-child{border-top:0}
.ml:hover{background:#f2f7fe}
.ml .mid{flex:1;min-width:0}
.ml .fr{display:flex;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.ml .fr b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ml .fr .src{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 100 auto}
.ml .fr .tm{margin-left:auto;flex:none}
.ml .sj{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml.unread .sj{font-weight:700}
.ml.unread .fr b::before{content:'● ';color:var(--accent);font-size:9px}
.ml .pv{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .why{flex:none;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--chip);color:var(--muted);margin-top:2px}
.ml.important .why{background:#fff3dc;color:#b26a00}
.mgrp{margin-top:6px;font-size:11.5px}
.mgrp > button{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;font-size:11.5px}
.mgrp.skip .ml{opacity:.7}
.msbox{border:1.5px solid #cfe0f8;border-radius:10px;padding:7px 9px;margin-bottom:7px;background:#f7fbff}
.msbox .code{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:2px;margin:3px 0;cursor:pointer;-webkit-user-select:all;user-select:all}
.msbox .acts{display:flex;gap:10px;align-items:center;margin-top:4px}

/* system monitor */
.chart{margin:3px 0 7px}
.chart .hd{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px}
.chart .hd b{font-weight:700}
.chart .hd .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.chart canvas{display:block;width:100%;height:46px;border-radius:6px;background:#f6f5f1}
</style>
</head>
<body>
<div id="root">
<div id="stage" class="side-right">
  <div id="balloon">
    <div class="bhead" id="bhead"><span class="t" id="btitle"></span><span id="bextra"></span><span class="pg" id="bpage"></span>
      <button class="bx" id="bbig" onclick="setBattle(!battle)" style="display:none"></button>
      <button class="bx" id="bclose" onclick="closeView()">✕</button></div>
    <div class="bbody" id="bbody"></div>
    <!-- kept outside the body so typing isn't lost when the body re-renders -->
    <div class="binput" id="binput"><input id="binText" autocomplete="off" spellcheck="false" onfocus="if(viewCtl && viewCtl.battle) setBattle(true)"
      onkeydown="if(event.key==='Enter' && !event.isComposing)submitInput(); if(event.key==='Escape')closeView()">
      <button id="binBtn" onclick="submitInput()"></button></div>
    <div class="bmsg" id="bmsg"></div>
    <div class="bfoot" id="bfoot"></div>
    <svg id="tail" viewBox="0 0 44 28"><path class="fill" d="M2,-4 L40,26 L24,-4 Z"/><path class="edge" d="M4,0 L40,26 L22,0"/></svg>
  </div>
  <div id="pet"><div id="sprite"></div><div id="hit"></div></div>
  <div id="hover"></div>
</div>
</div>

<script src="i18n.js"></script>
<script>
/* The character's window: just her and her speech balloon.

   What the balloon shows, most important first:
   1. reports from her jobs (features), one at a time, each with a ✓ button. A report that's
      still running shows its progress. Confirm them all and she goes idle.
   2. a feature's view, opened from her hover buttons or the menu (packages, system monitor)
   3. short quips (poke, hello) that fade by themselves
   Idle: hover over her for a button per feature; click her = poke; right-click = the menu.

   Each feature's page side is in FEATURES below (report / view / open). */

let state = {f: {}, reports: []}, prevState = null;
let view = null;            // feature id whose view is open
let quip = null, quipTimer = null;
let reportIdx = 0;
const PET_SCALE = 1.25;     // she's the main thing now: a bit bigger than when she held a panel

/* ---------------- features: their page side ---------------- */
const P = () => state.f.parcels || {};
function pkRow(it, withActs){
  const L = T(), p = L.p, d = !!it.delivered, n = esc(it.number);
  const busyOne = (P().refreshing || []).includes(it.number);
  const st = busyOne ? `<span class="dim">${L.updating}</span>` : it.status ? (d ? '✓ ' : '') + esc(it.status) : `<span class="dim">${L.waiting}</span>`;
  const meta = [it.location, it.event_time].filter(Boolean).map(esc).join(' · ');
  return `<div class="pk ${d?'done':''}" title="${esc(it.title || (it.source==='manual' ? L.manual : ''))}">
    <span class="tag ${esc(it.carrier)}">${esc(it.carrier || '?')}</span>
    <div class="mid"><div class="st">${st}</div>${meta ? `<div class="meta">${meta}</div>` : ''}
      <div class="num" title="${n}" onclick="copyNum('${n}')">${n}</div>
      ${it.error ? `<div class="e">${esc(errText(it.error))}</div>` : ''}</div>
    ${withActs ? `<div class="acts">
      <button title="${esc(p.refresh)}" onclick="fcall('parcels','refresh_one','${n}')"><span class="${busyOne?'spin':''}">⟳</span></button>
      <button title="${esc(p.open)}" onclick="api().open_url('${trackUrl(it.number)}')">↗</button>
      ${d ? '' : `<button title="${esc(p.archive)}" onclick="fcall('parcels','confirm','${n}')">🗄</button>`}</div>` : ''}
    ${d && withActs ? `<button class="gotbtn" onclick="gotIt('${n}')">${esc(p.got)}</button>` : ''}
  </div>`;
}
/* Claude Code: finished / needs you / permission / question (features/claude.py) */
const clSel = {};
function clProj(a){ return a.project ? `<span class="clproj">📁 ${esc(a.project)}</span>` : ''; }
function clLeft(a){ const m = Math.max(0, Math.round((a.until - Date.now() / 1000) / 60)); return T().cl.left(m); }
function clWhat(a){
  const C = T().cl, i = a.input || {}, t = a.tool || '';
  if(t === 'Bash') return {label: C.tools.Bash, code: i.command, note: i.description};
  if(['Edit', 'Write', 'MultiEdit', 'NotebookEdit', 'Read'].includes(t)) return {label: C.tools[t] || t, code: (i.file_path || i.notebook_path || '').replace(/^\/Users\/[^/]+/, '~')};
  if(t === 'WebFetch') return {label: C.tools.WebFetch, code: i.url};
  if(t === 'WebSearch') return {label: C.tools.WebSearch, code: i.query};
  const short = t.startsWith('mcp__') ? t.split('__').slice(1).join(' › ') : t;
  const j = JSON.stringify(i); return {label: C.tools.other(short), code: j && j !== '{}' ? (j.length > 400 ? j.slice(0, 400) + '…' : j) : ''};
}
async function clAnswer(rid, ans){ await api().feature('claude', 'answer', rid, ans); }
function clPick(rid, qi, label, multi, total){
  const sel = clSel[rid] = clSel[rid] || {};
  if(multi){ const set = new Set(sel[qi] || []); set.has(label) ? set.delete(label) : set.add(label); sel[qi] = [...set]; }
  else sel[qi] = label;
  if(total === 1 && !multi) return clSend(rid);
  renderBalloon();
}
function clSend(rid){
  const r = reports().find(x => x.id === rid); if(!r) return;
  const sel = clSel[rid] || {}, answers = {};
  (r.data.questions || []).forEach((q, qi) => { const v = sel[qi]; if(v && v.length) answers[q.question] = Array.isArray(v) ? v.join(', ') : v; });
  delete clSel[rid];
  clAnswer(rid, {answers});
}

const U_ = () => state.f.usb || {};
const USB_ICON = {hub:'🔀', printer:'🖨', storage:'💾', network:'🌐', input:'⌨️', audio:'🎧', video:'📺', camera:'📷',
  wireless:'📡', billboard:'🔌', vendor:'🔧', other:'🔧'};
const fmtMB = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
function linkList(links){

function usbRow(d, s){
  const U = T().u, sub = [d.vendor || '', U.kinds[d.kind] || '', d.speed].filter(Boolean).map(esc).join(' · ');
  const drv = (d.drivers || []).map(x => `<div class="drv" title="${esc(x.bundle + (x.path ? '\n' + x.path : ''))}">

    <div class="nm" title="${esc(d.name)} (${esc(d.vid)}:${esc(d.pid)})">${esc(d.product_db && d.name.length < 4 ? d.product_db : d.name)}</div>
    <div class="sub">${sub}</div>${drv}</div></div>`;

function prLines(p){
  const P = T().u.pr, U = T().u, k = esc(p.key || ''), nm = esc(p.mdl || p.name || ''), dv = p.driver || {};
  let l = '', acts = '';
  const job = (((state.f || {}).usb || {}).air || {}).jobs?.[p.key];
  if(p.st === 'configured'){
    l = P.configured(nm); acts = `<button class="lnk" onclick="fcall('usb','open_printers')">${esc(U.airMore)} ›</button>`;
  } else if(p.st === 'airprint' && job){
    const J = T().ap.job;
    l = P.airprint(nm) + `<div>${esc(job.st === 'working' ? J.working : job.st === 'done' ? J.done(job.queue || '') :
      job.st === 'manual' ? J.manual : J.error((T().ap.err || {})[job.msg] || job.msg || ''))}</div>`;
    if(job.st === 'error') acts = `<button class="lnk" onclick="fcall('usb','airprint','${k}')">${esc(U.retry)}</button>`;
  } else if(p.st === 'airprint'){
    l = P.airprint(nm); acts = `<button class="lnk" onclick="fcall('usb','airprint','${k}')">🖨 ${esc(U.air)}</button>
      <button class="lnk" onclick="fcall('usb','open_printers')">${esc(U.airMore)} ›</button>`;
  } else if(p.st === 'local'){
    l = P[p.st](nm); acts = `<button class="lnk" onclick="fcall('usb','printer_settings')">${esc(U.add)} ›</button>`;
  } else if(p.st === 'found'){
    l = P.found(nm, esc(dv.title), esc(dv.date || ''), fmtMB(dv.size || 0));
    acts = `<button class="lnk" onclick="fcall('usb','download','${k}')">⬇ ${esc(U.dl)}</button>`;
  } else if(p.st === 'downloading'){
    const pct = p.total ? Math.floor(100 * (p.done || 0) / p.total) : 0;
    l = P.downloading(esc(dv.title), pct, fmtMB(p.total || dv.size || 0)) + `<div class="bar"><div style="width:${pct}%"></div></div>`;
    acts = `<button class="lnk" onclick="fcall('usb','cancel_download')">${esc(U.cancel)}</button>`;
  } else if(p.st === 'downloaded'){
    l = P.downloaded(esc(dv.title));
    acts = `<button class="lnk" onclick="fcall('usb','open_file','${k}')">${esc(U.install)}</button>
      <button class="lnk" onclick="fcall('usb','reveal_downloads')">${esc(U.folder)}</button>
      <button class="lnk" onclick="fcall('usb','printer_settings')">${esc(U.add)} ›</button>`;
  } else if(p.st === 'none'){
    l = P.none(nm) + linkList(p.links);
  } else if(p.st === 'error'){
    l = `<span class="warn">${esc(P.error(p.err || ''))}</span>`;
    acts = `<button class="lnk" onclick="fcall('usb','download','${k}')">${esc(U.retry)}</button>`;
  }
  return l ? `<div class="ln prl">${l}${acts ? `<div class="acts">${acts}</div>` : ''}</div>` : '';
}

/* ---------------- system monitor charts (candlesticks) ---------------- */
const fmtRate = b => b < 1024 ? Math.round(b) + ' B/s' : b < 1048576 ? (b/1024).toFixed(b < 10240 ? 1 : 0) + ' KB/s' : (b/1048576).toFixed(1) + ' MB/s';
const fmtGB = b => (b / 1073741824).toFixed(1);
const SLOTS = 36;
const sysmon = {
  timer: null,
  start(){ this.stop(); this.tick(); this.timer = setInterval(() => this.tick(), 1000); },
  stop(){ clearInterval(this.timer); this.timer = null; },
  colors(){
    const c = (state.f.sysmon || {}).colors || 'auto';
    const redUp = c === 'red_up' || (c === 'auto' && lang === 'zh');
    const R = '#e5484d', G = '#2f9e5b';
    return redUp ? {up: R, down: G} : {up: G, down: R};
  },
  async tick(){
    if(view !== 'sysmon') return this.stop();
    const d = await api().feature('sysmon', 'candles', null, SLOTS);
    if(!d || !d.series || view !== 'sysmon') return;
    const S = T().sys, now = d.now || {}, info = d.info || {};
    const vals = {
      cpu: now.cpu != null ? `${Math.round(now.cpu)}%` + (info.cores ? ` · ${info.cores}${lang === 'zh' ? ' 核' : ' cores'}` : '') : '',
      ram: now.ram != null ? `${Math.round(now.ram)}%` + (info.ram_total ? ` · ${fmtGB(info.ram_used)}/${fmtGB(info.ram_total)} GB` : '') : '',
      down: now.down != null ? '↓ ' + fmtRate(now.down) : '', up: now.up != null ? '↑ ' + fmtRate(now.up) : '',
    };
    for(const k of ['cpu','ram','down','up']){
      const v = $('sv_' + k); if(v) v.textContent = vals[k] || S.warming;
      this.draw($('sc_' + k), d.series[k] || [], k === 'cpu' || k === 'ram' ? 100 : null);
    }
    const per = $('sysper'); if(per) per.textContent = S.per(d.period);
  },
  draw(cv, cs, fixedMax){
    if(!cv) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if(cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const pad = 4, max = fixedMax || Math.max(10240, ...cs.map(c => c.h)) * 1.12;
    const y = v => H - pad - (v / max) * (H - pad * 2);
    g.strokeStyle = '#00000012'; g.lineWidth = 1;
    for(const f of [.25, .5, .75]){ const yy = Math.round(y(max * f)) + .5; g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); }
    const col = this.colors(), sw = W / SLOTS, bw = Math.max(2, sw * 0.62), off = SLOTS - cs.length;
    cs.forEach((c, i) => {
      const x = (off + i) * sw + sw / 2, color = c.c >= c.o ? col.up : col.down;
      g.strokeStyle = g.fillStyle = color; g.lineWidth = 1;
      g.beginPath(); g.moveTo(Math.round(x) + .5, y(c.h)); g.lineTo(Math.round(x) + .5, y(c.l)); g.stroke();   // wick
      const top = y(Math.max(c.o, c.c)), h = Math.max(1.2, Math.abs(y(c.o) - y(c.c)));
      g.fillRect(x - bw / 2, top, bw, h);                                                                  // body
    });
  },
};

/* ---------------- layout ----------------
   The window is as big as she and her balloon need. Her feet stay where they are: the
   backend keeps the bottom corner on her side fixed while the window grows or shrinks. */
function sizes(){
  const sk = state.skin, z = state.zoom || .78;
  const H = (sk ? (sk.display_height || 116) : 116) * PET_SCALE;
  const W = sk ? sk.cell[0] * H / sk.cell[1] : H * .92;
  return {W, H, bw: 262, bmax: Math.max(240, (state.max_h || 390) / z)};
}
function hoverSpots(n){
  // buttons on an arc over her head, leaning towards the free side (x from her left edge)
  const {W, H} = sizes(), r = H * .58, cx = W / 2, cy = H * .3, out = [];
  const a0 = -172, a1 = n > 3 ? -70 : -76;   // stay left of her head: the window has no room on her right
  for(let i = 0; i < n; i++){
    const a = (n === 1 ? (a0 + a1) / 2 : a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}
let lastFit = '';
function layout(){
  const {W, H, bmax} = sizes(), right = (state.skin_side || 'right') === 'right';
  const stage = $('stage'), b = $('balloon'), petEl = $('pet');
  stage.className = right ? 'side-right' : 'side-left';
  petEl.style.width = W + 'px'; petEl.style.height = H + 'px';
  let SW, SH;
  // room for the hover buttons is always kept, so the window doesn't jump when they appear
  const spots = hoverSpots(((state.features || []).filter(f => f.hover)).length || 3);
  // a button is 34px (40 when hovered) and its name label sits above it: keep room for both,
  // or the window cuts the label off
  const extraX = Math.max(0, -Math.min(...spots.map(s => s[0] - 48)));
  const extraY = Math.max(0, -Math.min(...spots.map(s => s[1] - 50)));
  SW = W + extraX; SH = H + extraY;
  if(b.classList.contains('show')){
    const big = b.classList.contains('battle');
    $('bbody').style.maxHeight = Math.max(80, (big ? Math.max(bmax, BATTLE_H) : bmax) - H * .56 - 80) + 'px';
    const over = W * .7, lift = H * .6;
    b.style.bottom = lift + 'px';
    b.style.left = b.style.right = '';
    b.style[right ? 'right' : 'left'] = over + 'px';
    SW = Math.max(SW, over + b.offsetWidth + 6);
    SH = Math.max(SH, lift + b.offsetHeight + 8);
  }
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
  placeHover(SW, SH);
  const key = Math.round(SW) + 'x' + Math.round(SH);
  if(key !== lastFit && window.pywebview){ lastFit = key; api().fit(SW, SH); }
}
// the balloon's height changes while a report runs
new ResizeObserver(() => layout()).observe($('balloon'));

/* ---------------- hover buttons (idle mode) ---------------- */
let hoverTimer = null;
function buildHover(){
  const fs = (state.features || []).filter(f => f.hover);
  const key = fs.map(f => f.id).join() + lang;
  const h = $('hover'); if(h.dataset.key === key) return;
  h.dataset.key = key;
  const icon = f => FICONS[f.id] || esc(f.icon);
  h.innerHTML = fs.map(f => `<button class="fbtn" data-f="${f.id}" data-name="${esc(lang === 'zh' ? f.name_zh : f.name)}"
    onclick="openFeature('${f.id}')">${icon(f)}</button>`).join('') + '<div id="htip"></div>';
  h.querySelectorAll('.fbtn').forEach(el => {
    el.addEventListener('mouseenter', () => { clearTimeout(hoverTimer); showTip(el); });
    el.addEventListener('mouseleave', () => { $('htip').classList.remove('show'); hideHoverSoon(); });
  });
  lastFit = ''; layout();
}
// the name label: one fixed spot for every button, centered just above the arc of buttons (never over one)
function showTip(btn){
  const t = $('htip'), h = $('hover'), z = state.zoom || .78;
  t.textContent = btn.dataset.name;
  const r = h.getBoundingClientRect(), bs = [...h.querySelectorAll('.fbtn')].map(e => e.getBoundingClientRect());
  const top = Math.min(...bs.map(x => x.top)), left = Math.min(...bs.map(x => x.left)), right = Math.max(...bs.map(x => x.right));
  const w = t.offsetWidth;
  let x = ((left + right) / 2 - r.left) / z - w / 2;
  x = Math.max(2, Math.min(x, r.width / z - w - 2));
  let y = (top - r.top) / z - t.offsetHeight - 6;
  if(r.top + y * z < 2) y = (top - r.top) / z;      // no room above the arc: its top edge
  t.style.left = x + 'px'; t.style.top = y + 'px';
  t.classList.add('show');
}
function placeHover(SW, SH){
  const {W, H} = sizes(), right = (state.skin_side || 'right') === 'right';
  const btns = [...$('hover').querySelectorAll('.fbtn')], spots = hoverSpots(btns.length);
  const petLeft = right ? SW - W : 0, petTop = SH - H;
  btns.forEach((el, i) => {
    let [x, y] = spots[i];
    if(!right) x = W - x;          // mirror: lean the other way when she stands on the left
    el.style.left = (petLeft + x) + 'px'; el.style.top = (petTop + y) + 'px';
  });
}
const idle = () => !reports().length && !view && !drag;
function showHover(){ if(!idle()) return; clearTimeout(hoverTimer); quip = null; renderBalloon(); $('hover').classList.add('show'); }
function hideHover(){ clearTimeout(hoverTimer); $('hover').classList.remove('show'); }
function hideHoverSoon(){ clearTimeout(hoverTimer); hoverTimer = setTimeout(hideHover, 700); }
$('hit').addEventListener('mouseenter', () => showHover());
$('hit').addEventListener('mouseleave', () => hideHoverSoon());

/* ---------------- state ---------------- */
async function load(){
  prevState = state;
  const s = await api().get_state();
  if(!s) return;
  state = s;
  if(state.lang !== lang){ lang = state.lang; applyStaticText(); $('hover').dataset.key = ''; }
  $('root').style.setProperty('--z', state.zoom || .78);
  if(prevState.size_preset && prevState.size_preset !== state.size_preset){ pet.skin = null; lastFit = ''; }
  pet.setSkin(state.skin, state.skin_side);
  buildHover();
  // keep showing the same report while others come and go
  const curId = (prevState.reports || [])[reportIdx]?.id;
  const i = reports().findIndex(r => r.id === curId);
  reportIdx = i >= 0 ? i : 0;
  if(reports().length) hideHover();
  renderBalloon();
  pet.onState(prevState, state);
}
window.onBackendUpdate = () => load();

/* ---------------- the character ----------------
   - idle: blinks, fidgets, glances around; dozes off after 5 min without the mouse
   - a job running: thinking pose; delivered: jump + cheer; new package: cheer; failure: shy
   - mouse on the balloon: she looks at it with you
   - click her: poke (a random move and a line); right-click: the menu
   - dragging her: she runs in the drag direction */
const SLEEP_AFTER_MS = 5 * 60 * 1000;
const busy = () => reports().some(r => r.live) || !!P().busy;
const pet = {
  skin: null, side: 'right', scale: 1, cur: null, timer: null, looking: false, sleeping: false, walking: null,
  lastActive: Date.now(), greeted: false, idleTimer: null,

  setSkin(sk, side){
    side = side === 'left' ? 'left' : 'right';
    if((sk ? sk.id : '') === (this.skin ? this.skin.id : '') && side === this.side) return;
    this.skin = sk; this.side = side; lastFit = '';
    clearTimeout(this.timer); clearTimeout(this.idleTimer); this.cur = null;
    if(!sk) return;
    const [cw, ch] = sk.cell, s = sizes().H / ch;
    this.scale = s;
    const url = `skins/${encodeURIComponent(sk.id)}/${encodeURIComponent(sk.sheet)}`, sp = $('sprite');
    sp.style.backgroundImage = `url('${url}')`;
    const img = new Image();
    img.onload = () => { sp.style.backgroundSize = `${img.naturalWidth * s}px ${img.naturalHeight * s}px`; };
    img.src = url;
    this.toBase(); this.scheduleIdle();
  },
  frame(row, col){
    const [cw, ch] = this.skin.cell, s = this.scale;
    $('sprite').style.backgroundPosition = `-${col * cw * s}px -${row * ch * s}px`;
  },
  play(name, then, frames){
    if(!this.skin) return;
    const a = this.skin.anims[name];
    if(!a){ then ? then() : this.toBase(); return; }
    clearTimeout(this.timer);
    this.cur = {name, a, seq: frames || a.frames, i: 0, then};
    this.tick();
  },
  tick(){
    const c = this.cur; if(!c) return;
    this.frame(c.a.row, c.seq[c.i]);
    const dt = 1000 / (c.a.fps || 8);
    c.i++;
    if(c.i >= c.seq.length){
      if(c.a.loop) c.i = 0;
      else if(c.a.hold && !c.then) return;
      else { this.timer = setTimeout(() => { const t = c.then; this.cur = null; t ? t() : this.toBase(); }, dt); return; }
    }
    this.timer = setTimeout(() => this.tick(), dt);
  },
  isBase(){ return !this.cur || ['idle','think','sleep'].includes(this.cur.name) || this.cur.base; },
  lookAnim(){ return this.side === 'right' ? 'look_left' : 'look_right'; },   // towards the balloon
  toBase(){
    if(!this.skin) return;
    if(this.walking) return this.play('walk_' + this.walking);
    if(this.sleeping) return this.play('sleep');
    if(busy()) return this.play('think');
    if(this.looking){ this.play(this.lookAnim()); this.cur.base = true; return; }
    this.play('idle');
  },
  react(name){ if(!this.skin) return; this.sleeping = false; this.play(name); },
  poke(){
    if(this.sleeping){ this.wake(); return; }
    this.react(pick(['wave','jump','shy','cheer','fidget','look_around']));
    say(pick(T().pet.poke), 2500);
  },
  scheduleIdle(){
    clearTimeout(this.idleTimer);
    this.idleTimer = setTimeout(() => { this.idleAct(); this.scheduleIdle(); }, 2500 + Math.random() * 4000);
  },
  idleAct(){
    if(!this.skin || this.sleeping || this.walking || this.looking || busy() || !this.isBase()) return;
    const r = Math.random();
    if(r < .6) this.play('blink');
    else if(r < .75) this.play('fidget');
    else if(r < .9) this.play('look_around');
    else this.play('shy');
  },
  onState(prev, cur){
    if(!this.skin) return;
    const L = T().pet;
    if(!this.greeted){ this.greeted = true; this.play('jump', () => this.play('wave')); if(!reports().length) say(pick(L.hello)); return; }
    // a report just finished: react to what it says
    const was = Object.fromEntries((prev.reports || []).map(r => [r.id, r]));
    for(const r of cur.reports || []){
      const before = was[r.id];
      if(r.live || (before && !before.live)) continue;
      const s = (r.data || {}).sum;
      if(s && s.delivered.length) this.play('jump', () => this.play('cheer'));
      else if(s && s.new.length) this.react('cheer');
      else if((s && s.errors.length) || (r.data || {}).err) this.react('shy');
      else this.react('wave');
      return;
    }
    const wasBusy = (prev.reports || []).some(r => r.live) || !!((prev.f || {}).parcels || {}).busy;
    if(busy() !== wasBusy && this.isBase()) this.toBase();
  },
  hoverBalloon(on){
    if(!this.skin || this.looking === on) return;
    this.looking = on;
    if(this.sleeping || this.walking || !this.isBase()) return;
    const look = this.lookAnim();
    if(on){ this.play(look); this.cur.base = true; }
    else this.play(look, () => this.toBase(), [...this.skin.anims[look].frames].reverse());
  },
  walk(dir){ if(!this.skin || this.walking === dir) return; this.walking = dir; this.sleeping = false; this.play('walk_' + dir); },
  stopWalk(){ if(this.walking){ this.walking = null; this.toBase(); } },
  activity(){ this.lastActive = Date.now(); if(this.sleeping) this.wake(); },
  wake(){ this.sleeping = false; this.play('wake', () => this.play('wave')); say(T().pet.wake, 2200); },
  checkSleep(){
    if(!this.skin || this.sleeping || busy() || this.walking || reports().length || view) return;
    if(Date.now() - this.lastActive > SLEEP_AFTER_MS){
      this.sleeping = true; quip = null; renderBalloon();
      this.play('doze', () => this.play('sleep'));
    }
  },
};
$('balloon').addEventListener('mouseenter', () => pet.hoverBalloon(true));
$('balloon').addEventListener('mouseleave', () => pet.hoverBalloon(false));
document.addEventListener('mousemove', () => pet.activity(), {passive: true});
setInterval(() => pet.checkSleep(), 15000);
// right-click: the menu (same as the menu bar icon)
document.addEventListener('contextmenu', e => { e.preventDefault(); hideHover(); api().context_menu(); });

/* ---------------- dragging ----------------
   Drag her (or the balloon's title) to move the window. A press on her without moving is a poke. */
let drag = null;
document.addEventListener('mousedown', async e => {
  if(e.button !== 0) return;
  const onPet = e.target.id === 'hit', head = e.target.closest('.bhead');
  if(!onPet && (!head || e.target.closest('button, .batt, .clm'))) return;
  e.preventDefault();
  const d = drag = {sx:e.screenX, sy:e.screenY, lx:e.screenX, pos:null, target:null, busy:false, el: onPet ? $('hit') : head, onPet, moved:0};
  d.el.classList.add('dragging');
  d.pos = await api().get_pos();
  pump(d);
});
document.addEventListener('mousemove', e => {
  if(!drag) return;
  drag.target = [e.screenX - drag.sx, e.screenY - drag.sy];
  drag.moved = Math.max(drag.moved, Math.abs(drag.target[0]) + Math.abs(drag.target[1]));
  if(drag.moved > 4) hideHover();
  const step = e.screenX - drag.lx;
  if(Math.abs(step) >= 2){ pet.walk(step > 0 ? 'right' : 'left'); drag.lx = e.screenX; }
  pump(drag);
});
document.addEventListener('mouseup', () => {
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove('dragging'); pump(d); pet.stopWalk();
  if(d.onPet && d.moved < 4){ hideHover(); pet.poke(); }
});
async function pump(d = drag){
  if(!d || !d.pos || !d.target || d.busy) return;
  const [dx, dy] = d.target; d.target = null; d.busy = true;
  try{ await api().move(d.pos[0] + dx, d.pos[1] + dy); } finally { d.busy = false; }
  if(d.target) pump(d);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && view) closeView(); });

window.addEventListener('pywebviewready', () => { load(); setInterval(load, 60000); });
</script>
</body>
